name: Keep Render Alive

on:
  schedule:
    # Run every 5 minutes (Safe buffer for GitHub scheduler delays)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render Service
        run: |
          # Replace with your actual Render URL
          # Using curl -I (HEAD request) is lighter on resources
          curl -I https://prits-it-solutions.onrender.com || echo "Ping failed"
          
          # Optional: Ping the API health check too if you have one
          # curl -I https://prits-it-solutions.onrender.com/api/health || echo "API Ping failed"
